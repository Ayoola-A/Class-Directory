!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassBook - Mini Class Directory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <header>
       <h1>ClassBook</h1>
        <p>My Mini Class Directory</p>
    </header>

    <main class="container">
        <section class="announcement">
            <h2>Class Announcement</h2>
            <p id="announcement">Loading announcement...</p>
        </section>

        <section class="form-section">
            <h2>Add a Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student's name"
                    >
                    <small id="nameError" class="error"></small>
                </div>
                <div class="form-group">
                    <label for="studentScore">Student Score</label>
                    <input
                        type="number"
                        id="studentScore"
                        placeholder="Enter score (0-100)"
                    >
                    <small id="scoreError" class="error"></small>
                </div>
                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="directory">
            <h2>Student Directory</h2>
            <input
                type="text"
                id="searchInput"
                placeholder="Search students by name..."
            >
            <div id="studentList" class="student-list"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ClassBook Mini Class Directory</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
